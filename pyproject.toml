[project]
name = "ai-gateway"
version = "1.0.0"
description = "Secure AI API Gateway with FastAPI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "jinja2==3.1.2",
    "python-multipart==0.0.6",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "sqlalchemy==1.4.50",
    "python-jose[cryptography]==3.3.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"